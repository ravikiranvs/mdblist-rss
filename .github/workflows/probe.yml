name: Probe (temporary)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir out && cd out
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/131 Safari/537.36"
          L=https://mdblist.com/lists/giladg2/latest-releases
          curl -sSL -A "$UA" "$L/json" -o list.json
          curl -sSL -A "$UA" "$L" -o list.html
          ITEM=$(grep -oE 'href="/(movie|show)/[^"]+"' list.html | head -1 | cut -d'"' -f2)
          echo "$ITEM" > item_path.txt
          curl -sSL -A "$UA" "https://mdblist.com$ITEM" -o item.html
          ls -la
      - run: |
          cd out && git init -q -b probe && git add -A
          git -c user.name=bot -c user.email=bot@x commit -qm probe
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe
