name: Build RSS feeds

on:
  schedule:
    - cron: "30 8 * * *"   # daily 08:30 UTC = 2:00 PM IST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-feeds
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python build_feed.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feeds state
          git diff --cached --quiet || git commit -m "Update feeds $(date -u +%FT%TZ)"
          git push
